[package]
name = "coblet-download"
description = "Concurrent, verified, resumable downloads for coblet, with mirrors and a content-addressed cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
coblet-runtime.workspace = true
coblet-types.workspace = true
httpdate.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
coblet-runtime = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
