[package]
name = "coblet-catalog"
description = "Version catalogs for coblet: merged, cached, filterable lists of game versions, Mod Loader versions and server builds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
coblet-runtime.workspace = true
coblet-types.workspace = true
httpdate.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
coblet-runtime = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
