[package]
name = "coblet-player"
description = "Skins and capes for coblet: Minecraft services appearance API, public player lookup and a local skin library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
base64.workspace = true
coblet-auth.workspace = true
coblet-launch-command.workspace = true
coblet-runtime.workspace = true
coblet-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
coblet-runtime = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
