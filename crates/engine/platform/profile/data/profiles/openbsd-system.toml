# Sample profile for a platform Mojang does not support: OpenBSD evaluates
# the rules as Linux, loads LWJGL from the system packages in /usr/local/lib
# and uses an installed Java only.
id = "coblet:openbsd-system"
display_name = "OpenBSD (system libraries)"
priority = 200

[match]
os = ["openbsd"]
arch = ["x86_64", "aarch64"]
requires_component = { uid = "org.lwjgl3" }

[rules]
mojang_os = "linux"

[[natives]]
match = "org.lwjgl:*:*:natives-linux*"
source = { system = "/usr/local/lib" }

[[natives]]
match = "com.mojang:jtracy:*:natives-*"
source = "none"

[jvm]
append = ["-Dorg.lwjgl.librarypath=/usr/local/lib"]

[java]
source = "system-only"
