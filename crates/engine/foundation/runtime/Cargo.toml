[package]
name = "coblet-runtime"
description = "Injected services for coblet (transport, storage, clock, secrets, platform probe), extension registries, events and the Plan / Operation model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
coblet-types.workspace = true
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true, optional = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
coblet-runtime = { path = ".", features = ["fs"] }

[features]
# TokioStorage on tokio::fs.
fs = ["tokio/fs", "tokio/io-util", "tokio/rt"]
# TokioSpawner on tokio::process.
process = ["tokio/process", "tokio/io-util", "tokio/rt"]
# ReqwestTransport: reqwest with rustls (ring) and the platform certificate verifier.
reqwest = ["dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier"]
# Tests that talk to real services; they are also #[ignore]d.
online-tests = []

[lints]
workspace = true
