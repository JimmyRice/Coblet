[package]
name = "coblet-runtime"
description = "Injected services for coblet (transport, storage, clock, secrets, platform probe), extension registries, events and the Plan / Operation model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
coblet-types.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# TokioStorage on tokio::fs.
fs = ["tokio/fs", "tokio/io-util", "tokio/rt"]

[lints]
workspace = true
