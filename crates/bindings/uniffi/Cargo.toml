[package]
name = "coblet-uniffi"
description = "UniFFI bindings for coblet: Swift, Kotlin and Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# The uniffi-bindgen binary that generates foreign-language sources.
cli = ["uniffi/cli"]

[dependencies]
coblet = { workspace = true, default-features = true, features = ["auth-msa", "auth-loopback", "encrypted-secrets"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uniffi = { version = "0.32.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
