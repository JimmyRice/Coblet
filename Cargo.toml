[workspace]
resolver = "3"
members = [
    "crates/engine/foundation/runtime",
    "crates/engine/foundation/types",
    "crates/engine/metadata/catalog",
    "crates/engine/metadata/mojang",
    "crates/engine/platform/profile",
    "crates/engine/transfer/download",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
coblet-runtime = { path = "crates/engine/foundation/runtime" }
coblet-types = { path = "crates/engine/foundation/types" }
coblet-catalog = { path = "crates/engine/metadata/catalog" }
coblet-mojang = { path = "crates/engine/metadata/mojang" }
coblet-platform = { path = "crates/engine/platform/profile" }
coblet-download = { path = "crates/engine/transfer/download" }

bytes = { version = "1.12.1", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
httpdate = { version = "1.0.3", default-features = false }
regex-lite = { version = "0.1.9", default-features = false, features = ["std", "string"] }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.27", default-features = false }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.29.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
self_named_module_files = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = "fat"
