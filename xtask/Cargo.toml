[package]
name = "xtask"
description = "Repository automation for coblet: layer and module-root checks, code generation, packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
cbindgen = { version = "0.29.4", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing"] }

[lints]
workspace = true
